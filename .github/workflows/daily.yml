name: Daily publish

# Target is 4 posts/day (postsPerDay in site.config.mjs), but GitHub's
# `schedule` trigger is best-effort and can silently drop a run under
# platform load — a fixed 4-cron-slots setup left gaps with nothing to
# retry. So this fires every 2 hours instead; 05-publish-daily.mjs is
# quota-aware (--daily-quota) and only tops up to today's target, so
# extra fires are harmless no-ops and a dropped slot gets caught by
# the next one within ~2h instead of missing the whole day.
on:
  schedule:
    - cron: '15 */2 * * *'
  workflow_dispatch:            # manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: daily-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Top up today's posts from the content bank (quota-aware)
        run: node scripts/05-publish-daily.mjs --daily-quota 4

      - name: Build
        run: npm run build

      - name: Commit published content
        run: |
          git config user.name  "hardinshayari-bot"
          git config user.email "bot@users.noreply.github.com"
          git add src/content/posts public/cards scripts/data/content-bank.mjs data/keyword-queue.json
          git diff --staged --quiet || git commit -m "content: daily publish $(date -u +%F' '%H:%M) UTC"
          git push
